<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            color: rgba(255, 192, 203, 0.6);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.6;
            }
            50% {
                transform: translateY(-20px) rotate(10deg);
                opacity: 1;
            }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
            max-width: 500px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            color: #e91e63;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .question {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .gf-image {
            width: 200px;
            height: 200px;
            /* border-radius: 50%; */
            object-fit: cover;
            object-position: center 16%;
            background: linear-gradient(135deg, #ffeef7 0%, #fff0f5 100%);
            border: 5px solid #e91e63;
            box-shadow: 0 8px 20px rgba(233, 30, 99, 0.3);
            margin: 0 auto 30px;
            display: block;
            /* animation: imagePulse 3s ease-in-out infinite; */
            padding: 5px;
        }

        @keyframes imagePulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 8px 20px rgba(233, 30, 99, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 12px 30px rgba(233, 30, 99, 0.5);
            }
        }

        .buttons-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            position: relative;
            min-height: 80px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .yes-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            z-index: 100;
        }

        .yes-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .yes-btn:active {
            transform: scale(0.95);
        }

        .no-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            position: relative;
            transition: all 0.1s ease;
        }

        .no-btn.moving {
            position: fixed;
        }

        .no-btn:hover {
            transform: scale(1.05);
        }

        .success-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 60px;
            border-radius: 30px;
            font-size: 2em;
            z-index: 1000;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: celebrate 0.5s ease-out;
            text-align: center;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes celebrate {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .success-message.show {
            display: block;
        }

        .gif-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .celebration-gif {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 200px;
            max-height: 200px;
            animation: bounce 2s ease-in-out infinite;
        }

        .celebration-gif:nth-child(2) {
            animation-delay: 0.3s;
        }

        .celebration-gif:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f0f;
            position: absolute;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    
    <div class="container">
        <img src="https://qwgscvaibybtnnqooasc.supabase.co/storage/v1/object/sign/test/1769934750416.png?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV85MDE2NmM3OS05NTkzLTRhZGQtOTY2MS00NTA1MTc0Y2JkZmYiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ0ZXN0LzE3Njk5MzQ3NTA0MTYucG5nIiwiaWF0IjoxNzY5OTM3OTE4LCJleHAiOjE4MDE0NzM5MTh9.u_ObWLv0vkheYJk34XPR8cqzmhJyLuiefro9A4CBYZA" alt="My Valentine" class="gf-image" id="gfImage">
        <h1>💕 MADAM, Will You Be My Valentine? 💕</h1>
        <p class="question">Please choose your answer:</p>
        <div class="buttons-container">
            <button class="yes-btn" id="yesBtn">Yes! 💖</button>
            <button class="no-btn" id="noBtn">No 😢</button>
        </div>
    </div>

    <div class="success-message" id="successMessage">
        <div style="font-size: 1.2em; margin-bottom: 20px;">🎉 Yay! You said Yes! 🎉</div>
        <div class="gif-container" id="gifContainer">
            <!-- GIFs will be added here dynamically -->
        </div>
        <div style="font-size: 0.8em; margin-top: 20px;">You made my day! 💕</div>
        <div style="font-size: 0.7em; margin-top: 15px; opacity: 0.9;">This is going to be amazing! ✨</div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const successMessage = document.getElementById('successMessage');
        const heartsContainer = document.getElementById('hearts');
        const container = document.querySelector('.container');

        // Create floating hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = '💕';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.top = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 3 + 's';
            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 3000);
        }

        // Create hearts periodically
        setInterval(createHeart, 500);

        // Make "No" button run away from cursor (anywhere on the screen)
        document.addEventListener('mousemove', (e) => {
            const noBtnRect = noBtn.getBoundingClientRect();
            const noBtnCenterX = noBtnRect.left + noBtnRect.width / 2;
            const noBtnCenterY = noBtnRect.top + noBtnRect.height / 2;
            
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            const distance = Math.sqrt(
                Math.pow(mouseX - noBtnCenterX, 2) + 
                Math.pow(mouseY - noBtnCenterY, 2)
            );
            
            // If mouse is within 150px of the button, move it away
            if (distance < 150) {
                // Switch to fixed positioning when button starts moving
                if (!noBtn.classList.contains('moving')) {
                    noBtn.classList.add('moving');
                    // Get current position before switching
                    const currentRect = noBtn.getBoundingClientRect();
                    noBtn.style.left = currentRect.left + 'px';
                    noBtn.style.top = currentRect.top + 'px';
                }
                
                const angle = Math.atan2(
                    noBtnCenterY - mouseY,
                    noBtnCenterX - mouseX
                );
                
                const moveDistance = 200;
                const newX = noBtnCenterX + Math.cos(angle) * moveDistance;
                const newY = noBtnCenterY + Math.sin(angle) * moveDistance;
                
                // Keep button within viewport bounds
                const minX = 0;
                const minY = 0;
                const maxX = window.innerWidth - noBtnRect.width;
                const maxY = window.innerHeight - noBtnRect.height;
                
                const finalX = Math.max(minX, Math.min(newX, maxX));
                const finalY = Math.max(minY, Math.min(newY, maxY));
                
                noBtn.style.left = finalX + 'px';
                noBtn.style.top = finalY + 'px';
            }
        });

        // Exciting GIFs for celebration
        const celebrationGifs = [
            'https://qwgscvaibybtnnqooasc.supabase.co/storage/v1/object/sign/test/excited-guy-gif-2.gif?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV85MDE2NmM3OS05NTkzLTRhZGQtOTY2MS00NTA1MTc0Y2JkZmYiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJ0ZXN0L2V4Y2l0ZWQtZ3V5LWdpZi0yLmdpZiIsImlhdCI6MTc2OTkzNjY2NCwiZXhwIjoxODAxNDcyNjY0fQ.wmTaJ-mZ4bZfk1rxq4tNdTctMLpdFXKR64ZC9nTZuiI'
        ];

        // Handle "Yes" button click
        yesBtn.addEventListener('click', () => {
            container.style.display = 'none';
            successMessage.classList.add('show');
            
            // Add exciting GIFs
            const gifContainer = document.getElementById('gifContainer');
            gifContainer.innerHTML = ''; // Clear any existing content
            
            // Add 3-4 random GIFs
            const selectedGifs = celebrationGifs
                .sort(() => 0.5 - Math.random())
                .slice(0, 4);
            
            selectedGifs.forEach((gifUrl, index) => {
                setTimeout(() => {
                    const gif = document.createElement('img');
                    gif.src = gifUrl;
                    gif.className = 'celebration-gif';
                    gif.alt = 'Celebration';
                    gif.style.opacity = '0';
                    gif.style.transition = 'opacity 0.5s ease-in';
                    gifContainer.appendChild(gif);
                    
                    // Fade in animation
                    setTimeout(() => {
                        gif.style.opacity = '1';
                    }, 100);
                }, index * 200);
            });
            
            // Create confetti
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    createConfetti();
                }, i * 50);
            }
        });

        // Create confetti particles
        function createConfetti() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.top = '-10px';
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.width = Math.random() * 10 + 5 + 'px';
            confetti.style.height = confetti.style.width;
            document.body.appendChild(confetti);
            
            setTimeout(() => {
                confetti.remove();
            }, 3000);
        }

        // Try to catch the "No" button (it will always escape!)
        noBtn.addEventListener('click', () => {
            // Even if somehow clicked, move it away immediately
            // Ensure it's in fixed positioning mode
            if (!noBtn.classList.contains('moving')) {
                noBtn.classList.add('moving');
                const currentRect = noBtn.getBoundingClientRect();
                noBtn.style.left = currentRect.left + 'px';
                noBtn.style.top = currentRect.top + 'px';
            }
            
            const noBtnRect = noBtn.getBoundingClientRect();
            
            // Move to random position anywhere on screen
            const randomX = Math.random() * (window.innerWidth - noBtnRect.width);
            const randomY = Math.random() * (window.innerHeight - noBtnRect.height);
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            
            // Add a funny message
            const messages = [
                "Nice try! 😄",
                "Almost got me! 😅",
                "Too slow! 🏃",
                "Not today! 😎",
                "Try again! 😉"
            ];
            alert(messages[Math.floor(Math.random() * messages.length)]);
        });

        // No initialization needed - button starts in normal flow and aligns automatically
        // It will switch to fixed positioning when it starts moving
    </script>
</body>
</html>
